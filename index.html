<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI 互動學習課本</title>
  
  <!-- PWA & Mobile Web Capabilities -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fff8ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI課本">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="brand-badge">
        <span>📖</span>
        <span>AI 學習課本</span>
        <span class="star-counter" id="starCount">⭐ 0</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="notebookBtn" title="我的筆記本">📝<span class="note-count" id="noteCount"></span></button>
        <button class="icon-btn" id="tocToggleBtn" title="章節目錄">📋</button>
        <button class="icon-btn" id="themeToggleBtn" title="切換夜讀模式">🌙</button>
      </div>
    </header>

    <!-- Levels / Categories (10 大分冊) -->
    <div class="level-nav-header">
      <span class="level-nav-title" id="bookCountTitle">📚 分冊選書</span>
      <span class="level-nav-hint">左右滑動 ↔️</span>
    </div>
    <nav class="level-nav" id="levelTabs"></nav>

    <!-- Chapter Status & Progress Bar -->
    <div class="chapter-status-bar">
      <span class="chapter-label" id="chapterLabel">載入中...</span>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Main Learning Card (Reading + Quiz) -->
    <main class="homework-card" id="cardContainer">
      <!-- Injected dynamically by app.js -->
    </main>

    <!-- Bottom Navigation Controls -->
    <footer class="bottom-controls">
      <button class="btn btn-secondary" id="prevBtn" title="上一課">⬅️ 上一課</button>
      <button class="btn btn-primary" id="nextBtn" title="下一課">下一課 ➡️</button>
    </footer>
  </div>

  <!-- Table of Contents Drawer Modal -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <div class="drawer-content" id="drawerContent">
    <div class="drawer-header">
      <div class="drawer-title" id="drawerTitle">📑 課本章節目錄</div>
      <button class="icon-btn" id="drawerCloseBtn">✕</button>
    </div>
    <div class="drawer-section-label" id="drawerBooksLabel">📚 快速切換分冊：</div>
    <div class="drawer-books-bar" id="drawerBooksBar"></div>
    <ul class="drawer-list" id="drawerList"></ul>
  </div>

  <!-- 我的筆記本：答錯的題＋畫線的句子（9/25 兔兔要：一年下來知道到底哪裡不懂） -->
  <div class="drawer-content" id="notebookDrawer">
    <div class="drawer-header">
      <div class="drawer-title">📝 我的筆記本</div>
      <button class="icon-btn" id="notebookCloseBtn">✕</button>
    </div>
    <div class="nb-actions">
      <button class="btn btn-primary" id="nbCopyBtn">📋 複製給 Claude</button>
      <button class="btn btn-secondary" id="nbShareBtn">📤 分享</button>
    </div>
    <div class="nb-hint">複製後貼給 Claude，就會一條一條深入講給你聽</div>
    <div id="notebookList"></div>
  </div>

  <!-- 反白句子後浮出來的畫線鈕 -->
  <button class="mark-fab" id="markFab" hidden>🖍 畫線存起來</button>

  <!-- 畫線後選「不懂／不會用」＋寫一句 -->
  <div class="drawer-backdrop" id="markBackdrop"></div>
  <div class="mark-sheet" id="markSheet">
    <div class="mark-quote" id="markQuote"></div>
    <div class="mark-kinds">
      <button class="mark-kind active" data-kind="unclear">❓ 看不懂</button>
      <button class="mark-kind" data-kind="cantuse">🛠 懂但不會用</button>
      <button class="mark-kind" data-kind="keep">⭐ 重要，想記住</button>
    </div>
    <textarea id="markNote" rows="2" placeholder="想問什麼可以寫一句（不寫也可以）"></textarea>
    <div class="nb-actions">
      <button class="btn btn-secondary" id="markCancelBtn">取消</button>
      <button class="btn btn-primary" id="markSaveBtn">存起來</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="notebook.js"></script>
</body>
</html>
